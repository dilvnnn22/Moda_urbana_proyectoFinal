      SPRING_CONFIG_IMPORT: configserver:http://config-server:8888
    depends_on:
      - eureka-service
      - config-server
      - productos-service
      - clientes-service
      - categorias-service
      - marcas-service
      - pedidos-service
      - inventario-service
      - carrito-service
      - pagos-service
      - mysql-db

volumes:
  mysql_data:
