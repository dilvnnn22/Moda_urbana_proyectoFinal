      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      mysql-db:
        condition: service_started
      eureka-service:
        condition: service_started
      config-server:
        condition: service_started

  categorias-service:
